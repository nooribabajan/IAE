
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F8F7F2">

  <title>IAE | Imperial Academy of Education</title>

  <style>
    :root {
      --paper: #F8F7F2;
      --sky-blue: #72C7E8;
      --light-green: #91D6A4;
      --light-red: #EF9999;
      --ink: #34424A;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      isolation: isolate;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    /* Outer border — Sky Blue */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      border: 4px solid var(--sky-blue);
      pointer-events: none;
      z-index: 9999;
    }

    /* Middle border — Light Green */
    body::after {
      content: "";
      position: fixed;
      inset: 7px;
      border: 3px solid var(--light-green);
      pointer-events: none;
      z-index: 9999;
    }

    /* Inner border — Light Red */
    .page-border-red {
      position: fixed;
      inset: 13px;
      border: 2px solid var(--light-red);
      pointer-events: none;
      z-index: 9999;
    }

    /* Header */
    header {
      padding: 30px 20px;
      text-align: center;
      border-bottom: 1px solid #72C7E855;
    }

    .logo {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 7px;
      color: var(--sky-blue);
    }

    .academy-name {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #65B980;
    }

    /* Welcome section */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 25px;
      text-align: center;
    }

    .welcome {
      max-width: 650px;
    }

    .welcome h1 {
      font-size: clamp(28px, 5vw, 44px);
      margin-bottom: 18px;
      color: var(--ink);
    }

    .welcome h1 span {
      color: var(--sky-blue);
    }

    .welcome p {
      font-size: 18px;
      line-height: 1.8;
      color: #53636A;
    }

    /* Three-colour divider */
    .divider {
      width: 75px;
      height: 4px;
      margin: 25px auto;
      border-radius: 3px;
      background: linear-gradient(
        to right,
        var(--sky-blue) 0%,
        var(--sky-blue) 33.33%,
        var(--light-green) 33.33%,
        var(--light-green) 66.66%,
        var(--light-red) 66.66%,
        var(--light-red) 100%
      );
    }

    /* Subject notice */
    .notice {
      display: inline-block;
      padding: 14px 22px;
      background: #FFFFFFAA;
      border: 1px solid var(--light-green);
      border-radius: 8px;
      color: #548E68;
      font-size: 15px;
      line-height: 1.6;
    }

    /* Back to Class Index */
    .back-container {
      display: flex;
      justify-content: center;
      padding: 0 20px;
      margin-bottom: 15px;
    }

    #previousPageButton {
      padding: 10px 22px;
      background: transparent;
      color: #397F9D;
      border: 1px solid var(--sky-blue);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease,
                  color 0.2s ease;
    }

    #previousPageButton:hover {
      background: var(--sky-blue);
      color: #FFFFFF;
    }

    #previousPageButton:focus-visible {
      outline: 2px solid var(--light-red);
      outline-offset: 3px;
    }

    /* Footer */
    footer {
      padding: 18px 20px;
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
      color: #657178;
      border-top: 1px solid #EF999955;
    }

    /* Mobile layout */
    @media (max-width: 480px) {
      header {
        padding: 25px 18px;
      }

      .logo {
        font-size: 34px;
      }

      .academy-name {
        font-size: 11px;
        letter-spacing: 1.3px;
      }

      main {
        padding: 30px 22px;
      }

      .welcome p {
        font-size: 16px;
      }

      .notice {
        padding: 12px 15px;
        font-size: 14px;
      }
    }

    /* Respect reduced-motion preferences */
    @media (prefers-reduced-motion: reduce) {
      #previousPageButton {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <!-- Inner red border -->
  <div class="page-border-red" aria-hidden="true"></div>

  <!-- Academy header -->
  <header>
    <div class="logo">IAE</div>
    <div class="academy-name">
      Imperial Academy of Education
    </div>
  </header>

  <!-- Welcome content -->
  <main>
    <section class="welcome">

      <h1>Welcome to <span>IAE</span></h1>

      <p>
        The Rector welcomes you to the<br>
        Imperial Academy of Education.
      </p>

      <div class="divider"></div>

      <div class="notice">
        Your subject will be available here soon.
      </div>

    </section>
  </main>

  <!-- Return to Class Index -->
  <div class="back-container">
    <button id="previousPageButton" type="button">
      &#8592; Back to Class Index
    </button>
  </div>

  <!-- Footer -->
  <footer>
    &copy; 2026 Imperial Academy of Education.
    All rights reserved.
  </footer>

  <!-- Navigation -->
  <script>
    document
      .getElementById('previousPageButton')
      .addEventListener('click', function () {
        window.location.assign('../index.html');
      });
  </script>

</body>
</html>
