<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class 1 — Imperial Academy of Education</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f4f0df, #e8f0e8);
      color: #183b2b;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #164d36, #236b4b);
      color: #fff;
      padding: 28px 20px;
      text-align: center;
      border-bottom: 4px solid #c9a227;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 16px;
      opacity: 0.95;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .welcome-card {
      width: min(760px, 100%);
      background: #fffdf5;
      border: 2px solid #c9a227;
      border-radius: 24px;
      padding: 55px 35px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
    }

    .icon {
      font-size: 58px;
      margin-bottom: 15px;
    }

    h2 {
      margin: 0 0 18px;
      color: #164d36;
      font-size: 30px;
    }

    .message {
      font-size: 20px;
      line-height: 1.7;
      color: #405348;
      margin: 0;
    }

    .urdu {
      margin-top: 20px;
      font-size: 19px;
      color: #6b5420;
      direction: rtl;
    }

    footer {
      background: #164d36;
      color: #fff;
      text-align: center;
      padding: 16px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 24px;
      }

      .welcome-card {
        padding: 40px 22px;
      }

      h2 {
        font-size: 25px;
      }

      .message {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🎓 Imperial Academy of Education</h1>
    <p>Class 1</p>
  </header>

  <main>
    <section class="welcome-card">
      <div class="icon">🌱</div>

      <h2>Your Class Is Coming Soon</h2>

      <p class="message">
        Your classes will be loaded soon,<br>
        till that enjoy your leisure.
      </p>

      <p class="urdu">
        آپ کی کلاسیں جلد یہاں موجود ہوں گی۔<br>
        تب تک اپنے فرصت کے وقت سے لطف اٹھائیں۔
      </p>
    </section>
  </main>

  <footer>
    Imperial Academy of Education<br>
    علم، فہم، کردار اور مستقبل
  </footer>

</body>
</html>
