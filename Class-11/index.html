<style>

.main-heading-strip{position:relative;min-height:145px;padding:28px 150px 29px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center}.main-heading-title{color:#f4d77b;font-family:Arial,sans-serif;font-weight:700;font-size:clamp(1.65rem,4.8vw,3rem);line-height:1.3;text-align:center;direction:ltr}.main-heading-subtitle{margin-top:8px;font-size:clamp(.9rem,2vw,1.15rem);text-align:center}.main-heading-logo{position:absolute;right:25px;top:20px;width:105px;max-width:18%;height:auto}.iae-logo{display:block;width:105px;max-width:40%;height:auto}
.page-container{position:fixed;top:145px;left:3px;right:3px;bottom:3px;overflow:hidden;min-width:0;box-sizing:border-box;border-radius:0 0 10px 10px}
.level1-layout{position:absolute;inset:0;width:100%;max-width:100%;height:100%;margin:0;padding:20px 0 0 250px;display:block;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;direction:ltr;box-sizing:border-box;transition:padding-left .22s ease;scrollbar-gutter:stable;min-width:0}.level1-layout.nav-expanded{padding-left:0}

.level1-content{display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box;direction:rtl;background:#fffdf8;border-radius:22px;padding:40px;border:1px solid rgba(199,157,50,.35);box-shadow:0 8px 25px rgba(0,0,0,.08);overflow-wrap:anywhere;word-break:normal;hyphens:auto;container-type:inline-size}
.hero{text-align:center;padding-bottom:28px;border-bottom:1px solid #e3d9bf}.hero-icon{font-size:3rem}.hero h2{margin:8px 0;color:#173f35;font-family:Arial,sans-serif;font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.4}.vision-label{margin-top:15px;color:#9a7624;font-family:Arial,sans-serif;font-weight:bold;direction:ltr}.vision-text{color:#173f35;font-size:clamp(1.4rem,3vw,2rem);font-weight:bold;margin-top:8px;overflow-wrap:break-word}.gold-line{width:90px;height:4px;background:#c79d32;margin:18px auto;border-radius:10px}.introduction{width:100%;max-width:1000px;min-width:0;margin:30px auto}.introduction p{margin:0 0 22px;font-size:clamp(.96rem,1.6vw,1.1rem);overflow-wrap:break-word}.section-title{color:#173f35;margin:42px 0 15px;font-size:clamp(1.4rem,3vw,2rem);line-height:1.6}.vision-list{padding-right:30px;margin:15px 0 25px}.vision-list li{margin-bottom:7px}.highlight-box{background:#f7efd7;border-right:5px solid #c79d32;padding:20px;border-radius:12px;margin:25px 0;color:#173f35;overflow-wrap:break-word}.center{text-align:center}.final-vision{text-align:center;margin:45px -40px 0;padding:30px 40px 0;border-top:1px solid #e3d9bf;max-width:none;width:calc(100% + 80px);box-sizing:border-box}
.class-navigation{position:fixed;left:20px;top:145px;bottom:12px;max-height:calc(100dvh - 190px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;width:230px;z-index:900;direction:rtl;transition:transform .22s ease,opacity .22s ease;will-change:transform,opacity}.class-navigation.nav-hidden{transform:translateX(calc(-100% - 24px));opacity:0;pointer-events:none}.nav-handle{position:fixed;left:0;top:144px;width:34px;min-height:108px;z-index:960;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:linear-gradient(135deg,#123c34,#285c4d);color:#f4d77b;border:1px solid #c79d32;border-left:0;border-radius:0 12px 12px 0;box-shadow:0 5px 16px rgba(0,0,0,.18);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .22s ease}.nav-handle.visible{opacity:1;pointer-events:auto}.nav-handle span{font:700 .62rem/1 Arial,sans-serif;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.4px}.nav-reveal-zone{display:none}.class-heading{background:linear-gradient(135deg,#123c34,#285c4d);color:#f4d77b;text-align:center;padding:12px 8px;border-radius:12px 12px 0 0;font-family:Arial,sans-serif;font-weight:bold;margin-bottom:0}
.class-tabs{display:flex;flex-direction:column;gap:0}.class-tab{display:flex;width:100%;height:42px;min-height:42px;flex:0 0 42px;align-items:center;justify-content:center;text-decoration:none;text-align:center;background:#fff;color:#173f35;padding:4px 6px;margin:0;border-radius:0;border:0;border-right:0}

/* New Back Button Styling */
.back-btn-container {
    display: flex;
    justify-content: flex-start;
    margin-top: 35px;
    padding-top: 15px;
    width: 100%;
}
.back-btn {
    background: linear-gradient(135deg, #123c34, #285c4d);
    color: #f4d77b;
    border: 2px solid #c79d32;
    padding: 8px 30px;
    font-size: 1.05rem;
    font-family: Arial, sans-serif;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}
.back-btn:hover {
    background: linear-gradient(135deg, #285c4d, #123c34);

}

<body>

<header class="site-header">
    <div class="main-heading-strip">
        <h1 class="main-heading-title">Imperial Academy of Education</h1>
        <div class="main-heading-subtitle">First Year Pre-Medical</div>
    </div>
</header>

<div class="page-container">
    <!-- Main Content Area -->
    <div class="level1-layout">
        <div class="reading-container">
            <div class="level1-content">
                <div class="hero">
                    <div class="hero-icon">🎓</div>
                    <h2>First Year Pre-Medical</h2>
                    <div class="gold-line"></div>
                </div>

                <div class="introduction">
                    <p>Khush Aamdeed! Yeh aapka main study portal hai jahan aap apna content dekh sakte hain.</p>
                </div>

                <!-- Previous Page Button Container (Footer se upar, content ke aakhir mein) -->
                <div class="back-btn-container">
                    <button type="button" id="previousPageButton" class="back-btn">پچھلا صفحہ (Go Back)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Sidebar Navigation Fixed Container -->
    <div class="class-navigation">
        <h3 class="class-heading">Navigation</h3>
        <div class="class-tabs">
            <!-- Aap ke baqi tabs yahan aayenge -->
        </div>
    </div>
</div>

<!-- Navigation Script Fix -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    var backButton = document.getElementById('previousPageButton');
    if (backButton) {
        backButton.addEventListener('click', function(event) {
            event.preventDefault(); // Kisi bhi default action ya page freeze ko rokne ke liye
            
            // Agar browser ke pas record hai user kahan se aaya toh directly wahan bhejna
            if (document.referrer && document.referrer !== "") {
                window.location.replace(document.referrer);
            } 
            // Fallback: Agar referrer na mile toh hardware history navigation invoke karna
            else if (window.history.length > 1) {
                window.history.back();
            } 
            // Ultimate fallback path
            else {
                window.location.href = '../../index.html';
            }
        });
    }
});
</script>

</body>
